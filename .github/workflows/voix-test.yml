name: Voix test

# Échantillons de voix pour le Reel sitcom : se lance quand social/voix-test/request.txt change, et commite les mp3.
on:
  push:
    branches: [main]
    paths: ["social/voix-test/request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts numpy scipy soundfile
      - run: cd pipeline && python voice_samples.py
      - run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add social/voix-test
          git diff --cached --quiet && exit 0
          git commit -m "Voix test : échantillons"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
