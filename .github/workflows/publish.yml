name: Publication

on:
  schedule:
    - cron: "2 3 * * *"   # 5 h à Paris l'été
    - cron: "2 4 * * *"   # 5 h à Paris l'hiver
  workflow_run:
    workflows: ["Images"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read      # récupérer les artefacts Instagram

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt   # Pillow : image de partage (share_card.py)
      # Instagram : les carrousels et Reels ne sont pas dans git (le dépôt grossirait sans fin) mais dans des
      # artefacts « instagram-<date> » gardés 7 jours ; on récupère ceux des 3 derniers jours pour les mettre en ligne.
      - name: Fichiers Instagram (artefacts)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 18 novembre 2026 (soir) : trois Reels sitcom par jour (<date>-sitcom-origine, -cultureg, -insolite), plus de
          # carrousels. Un rendu commun porte le nom du dernier dossier rendu, des rendus séparés portent chacun le leur.
          # On liste donc TOUS les artefacts « instagram-<date>… » encore valides et on les ouvre du plus ancien au plus
          # récent : le rendu le plus récent d'un post gagne toujours.
          for i in 0 1 2; do
            d=$(TZ=Europe/Paris date -d "-$i day" +%F)
            list=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.expired | not) | select(.name | startswith(\"instagram-$d\")) | \"\(.created_at) \(.id) \(.name)\"" 2>/dev/null | sort || true)
            if [ -n "$list" ]; then
              echo "$list" | while read -r at id name; do
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/ig.zip 2>/dev/null \
                  && unzip -o -q /tmp/ig.zip -d social/instagram && echo "Instagram $name ($at) : fichiers récupérés" || true
              done
            else
              # Secours (liste indisponible) : les noms connus, le plus « large » d'abord.
              for n in "$d-sitcom-origine" "$d-sitcom-insolite" "$d-sitcom-cultureg" "$d-sitcom" "$d-actu" "$d"; do
                gh run download -n "instagram-$n" -D social/instagram >/dev/null 2>&1 && echo "Instagram $n : fichiers récupérés" || true
              done
            fi
          done
      - name: Publier l'édition du jour et construire le site
        run: python pipeline/publish.py
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add -A editions stock data/health.json data/queue.json data/checks.json
          git diff --cached --quiet || git commit -m "Publication"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || echo "::warning::Push impossible après 3 essais ; le site est quand même déployé."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      # Les moteurs sont prévenus des nouvelles pages dès la mise en ligne (liste écrite par pipeline/seo.py).
      - name: Prévenir les moteurs de recherche (IndexNow)
        continue-on-error: true
        run: |
          [ -f indexnow.json ] || { echo "Rien de nouveau à signaler."; exit 0; }
          curl -sS -m 20 -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data-binary @indexnow.json
