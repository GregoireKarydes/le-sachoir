name: Publication

on:
  schedule:
    - cron: "2 3 * * *"   # 5 h à Paris l'été
    - cron: "2 4 * * *"   # 5 h à Paris l'hiver
  workflow_run:
    workflows: ["Images"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publier l'édition du jour et construire le site
        run: python pipeline/publish.py
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add editions data/health.json
          git diff --cached --quiet || git commit -m "Publication"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || echo "::warning::Push impossible après 3 essais ; le site est quand même déployé."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
