name: Contrôle

# À chaque modification : les éditions sont-elles valides, le pipeline passe-t-il ses tests ?
# Un échec ne bloque pas la publication (publish.py écarte ce qui est cassé) mais te prévient par mail.
on:
  push:
    paths:
      - "editions/**/edition.json"
      - "pipeline/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - name: Éditions
        run: python pipeline/validate.py
      - name: Tests
        run: python -m pytest -q tests
