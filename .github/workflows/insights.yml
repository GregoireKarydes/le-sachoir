name: Statistiques réseaux

# 18 novembre 2026. Lit chez Buffer les métriques des posts Instagram et TikTok du Sachoir (vues, portée, j'aime,
# commentaires, partages, enregistrements, abonnés gagnés) et écrit social/instagram/stats.md et stats.json, que
# lisent les tâches Claude « Instagram », « Reel sitcom » et « Stratège Instagram » (bilan du dimanche).
# Au plus une fois par 20 h (le script s'arrête tout seul sinon). Comme les crons GitHub partent avec 6 à 9 h de
# retard, il tourne aussi après chaque Publication (lancée par la tâche « Top départ »).
# Une poussée de data/heartbeat/insights.txt (tâche « Stratège Instagram ») force une mise à jour.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_run:
    workflows: ["Publication"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/heartbeat/insights.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Métriques Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE" = "true" ]; then python pipeline/social_insights.py --force; else python pipeline/social_insights.py; fi
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add social/instagram
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Statistiques réseaux"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || { echo "::error::Push impossible"; exit 1; }
