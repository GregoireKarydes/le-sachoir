name: Avatars

on:
  push:
    paths: ["pipeline/avatars.py"]
  workflow_dispatch:
    inputs:
      redo:
        description: "Numéros d'avatars à refaire (ex. 3,7)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Générer les avatars
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          REDO: ${{ github.event.inputs.redo }}
        run: python pipeline/avatars.py
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add app/assets/avatars
          git diff --cached --quiet || git commit -m "Avatars HD"
          git pull --rebase && git push
