name: Instagram

# 17 novembre 2026. La tâche Claude « Le Sachoir – Instagram » pousse chaque matin social/instagram/<date>/post.json.
# 1. Rendu (à chaque push d'un post.json) : carrousel 1080 x 1350 ou Reel 1080 x 1920 avec voix Kokoro. Les images et
#    vidéos vont dans un artefact « instagram-<date> » gardé 7 jours (jamais dans git : seul render.json est commité),
#    puis la Publication est relancée : elle récupère l'artefact et met les fichiers en ligne sur le site.
# 2. Envoi (9 h 10, 10 h 40 et 11 h 40 à Paris l'hiver) : le post du jour part chez Buffer, programmé à son heure
#    (12 h 15 par défaut). Rien n'est envoyé tant que le secret BUFFER_API_KEY n'existe pas.

on:
  push:
    branches: [main]
    paths:
      - "social/instagram/**/post.json"
  schedule:
    - cron: "10 8 * * *"
    - cron: "40 9 * * *"
    - cron: "40 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Un post à rendre ?
        id: need
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, "pipeline")
          from pathlib import Path
          from social_render import fingerprint
          need = []
          for pj in Path("social/instagram").glob("*/post.json"):
              rj = pj.parent / "render.json"
              fp = fingerprint(json.loads(pj.read_text()))
              if not rj.exists() or json.loads(rj.read_text()).get("fingerprint") != fp:
                  need.append(pj.parent.name)
          print("render=" + ("yes" if need else "no"))
          print("artifact=instagram-" + (max(need) if need else "none"))
          print("reel=" + ("yes" if any(json.loads((Path("social/instagram") / n / "post.json").read_text()).get("kind") == "reel" for n in need) else "no"))
          EOF
      - name: Voix (Kokoro)
        if: steps.need.outputs.reel == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile
      - name: Rendu
        if: steps.need.outputs.render == 'yes'
        run: python pipeline/social_render.py
      - name: Garder les fichiers 7 jours (artefact, pas dans git)
        if: steps.need.outputs.render == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.need.outputs.artifact }}
          path: |
            social/instagram/*/*.jpg
            social/instagram/*/*.mp4
          retention-days: 7
          if-no-files-found: error
      - name: Envoi à Buffer
        if: github.event_name != 'push'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python pipeline/social_publish.py
      - name: Commit
        id: commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Instagram"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || { echo "::error::Push impossible"; exit 1; }
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Mettre les fichiers en ligne (Publication)
        if: steps.need.outputs.render == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
