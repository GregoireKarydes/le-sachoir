name: Images

on:
  push:
    paths:
      - "editions/**/edition.json"
      - "pipeline/style.json"
      - "pipeline/style_ref.png"
  schedule:
    - cron: "17 0-6 * * *"     # toutes les heures la nuit : reprend les images en attente
    - cron: "17 8-22/2 * * *"  # et toutes les 2 h dans la journée : le stock prend de l'avance quand il reste du quota
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Générer les images manquantes
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python pipeline/images.py
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add editions data/images-last-run.json data/images-quota.json
          [ -f data/images-fal.json ] && git add data/images-fal.json || true
          git diff --cached --quiet || git commit -m "Images générées"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || { echo "::error::Push impossible après 3 essais"; exit 1; }
