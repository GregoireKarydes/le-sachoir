name: Collecte RSS

on:
  push:
    branches: [main]
    paths:
      - "data/heartbeat/rss.txt"   # « top » de 19 h poussé par la tâche Claude « Le Sachoir – Top départ »
  schedule:
    # Avant l'Actu du soir (19 h 47, heure de Paris) : 18 h 20 et 19 h 20 l'hiver (19 h 20 et 20 h 20 l'été).
    - cron: "20 17,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss   # pas la file des images : la collecte y attendait des heures et arrivait après l'Actu (constaté du 13 au 15 novembre 2026)
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/collect_rss.py
      - name: Commit
        run: |
          git config user.name "sachoir-bot"
          git config user.email "sachoir-bot@users.noreply.github.com"
          git add data/rss
          git diff --cached --quiet || git commit -m "RSS du jour"
          for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep $((i * 15)); done
          [ -n "$ok" ] || { echo "::error::Push impossible après 3 essais"; exit 1; }
