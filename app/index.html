<style>

:root{
  /* Charte des maquettes : fond crème, titres serif gras, cartes vert / bleu / orange, boutons jaune d'or. */
  --cream:#faf6ee;
  --ink:#17140f;
  --muted:#5f5a52;
  --green:#1f8f5f;
  --green-d:#14704a;
  --yellow:#f5b62a;
  --navy:#2f4fa2;
  --navy-d:#14275c;
  --orange:#f2a33a;
  --red:#d9473a;
  --purple:#8a55b8;
  --line:#e7e1d4;
  --grey:#efebe3;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-sans:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-letter:"Patrick Hand SC","Comic Sans MS",cursive;
  --f-hand:Caveat,"Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#d6d6db;color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.logo{display:flex;justify-content:center;padding:18px 0 4px;position:relative}
.streakmini{position:absolute;right:16px;top:50%;margin-top:-2px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:3px;border:0;background:#fff1cf;border-radius:999px;padding:4px 10px 4px 7px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;color:#a3580a}
.streakmini .fl{font-size:16px;line-height:1}
.installmini{position:absolute;left:16px;top:50%;margin-top:-2px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:4px;border:0;background:var(--yellow);border-radius:999px;padding:5px 10px 5px 8px;font-weight:700;font-size:13px;color:var(--ink)}
.installmini svg{width:15px;height:15px}
.installmini[hidden],.tb-install[hidden]{display:none}
.logo img{height:46px;width:auto;display:block}
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:none;padding:8px 18px 26px;flex-direction:column;gap:16px}
.view.on{display:flex}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);position:relative}
.nav button{flex:1;background:none;border:0;padding:10px 4px 14px;font-weight:500;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#3d3832;position:relative}
.nav button svg{width:26px;height:26px}
.nav button[aria-current=page]{font-weight:700;color:var(--ink)}
.nav button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--ink)}

.serif{font-family:var(--f-serif);font-weight:800;letter-spacing:-.2px}
.h1{font-family:var(--f-serif);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.lead{margin:2px 0 0;font-size:15.5px;color:#2d2924;line-height:1.3}
.sub{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.streak{background:var(--yellow);font-weight:900;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.pill.hist{background:var(--grey);font-weight:500;font-size:15px}
.pill.hist svg{width:18px;height:18px}
.date{font-size:19px;font-weight:700;margin:0;white-space:nowrap}
.pill.hist{flex:0 0 auto}
.hello{font-size:25px;white-space:nowrap}
.iconbtn{background:none;border:0;padding:6px;display:grid;place-items:center;border-radius:50%}
.iconbtn svg{width:26px;height:26px}

/* cartes */
.card{position:relative;border-radius:20px;color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:0 8px 18px rgba(23,20,15,.16);text-align:left;border:0;width:100%}
.card.green{background:var(--green)}
.card.navy{background:var(--navy)}
.card.navy-d{background:var(--navy-d)}
.card.orange{background:var(--orange);color:var(--ink)}
.card.red{background:var(--red)}
.tag{align-self:flex-start;background:rgba(0,0,0,.22);color:#fff;border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
.card.orange .tag{background:rgba(120,60,0,.18);color:var(--ink)}
.card h3{font-family:var(--f-serif);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
.card.big h3{font-size:31px}
.stamp{position:absolute;top:9px;right:12px;font-family:var(--f-hand);font-size:14.5px;line-height:.92;color:var(--ink);text-align:center;transform:rotate(9deg);
  border:2px solid var(--ink);border-radius:50%;padding:5px 10px}
.card.big .stamp + h3{margin-top:14px}
.illu{position:relative;margin:0 -16px;display:flex;justify-content:center}
.illu img{width:100%;max-width:330px;height:auto;display:block}
.illu .tag{position:absolute;left:16px;bottom:6px}
.cta{background:var(--yellow);color:var(--ink);border:0;border-radius:999px;padding:13px 16px;font-weight:700;font-size:18px;text-align:center;width:100%;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.cta:active{transform:translateY(2px);box-shadow:none}
.tagline{font-size:12.5px;text-align:center;opacity:.92;margin:-2px 0 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card.small{padding:12px;gap:7px;min-height:196px}
.card.small h3{font-size:18.5px}
.card.small .mid{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:auto}
.card.small .tag{white-space:nowrap;font-size:9.5px!important;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card.small .tag{font-size:10.5px;padding:3px 7px}
.card.small .face{width:58px;border-radius:10px;display:block;margin-right:-4px}
.card.small .face.cat{width:56px}
.dur{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:rgba(0,0,0,.2);color:#fff;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;position:relative;z-index:1}
.card.orange .dur{background:rgba(120,60,0,.18);color:var(--ink)}
.dur svg{width:13px;height:13px}
.card.small .tl{font-size:11.5px;font-weight:700;line-height:1.2;position:relative;z-index:1}
.card.wide{flex-direction:row;align-items:stretch;gap:12px;padding:14px}
.card.wide .txt{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.card.wide h3{font-size:21px}
.card.wide .pic{flex:0 0 118px;border-radius:12px;overflow:hidden;background:#fff}
.card.wide .pic svg,.card.wide .pic img{width:100%;height:100%;display:block;object-fit:cover}
.readstate{font-size:12px;font-weight:700;opacity:.9}
.daily{font-size:13.5px;color:var(--muted);text-align:center;margin:0;text-wrap:balance}
.banner{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.banner p{margin:0;font-size:13.5px;flex:1;color:var(--muted)}
.banner strong{display:block;font-size:15px;color:var(--ink)}
.btn{border:0;background:var(--yellow);border-radius:999px;padding:11px 16px;font-weight:700;font-size:15.5px;text-align:center}
.btn.ghost{background:var(--grey)}
.btn.dark{background:var(--ink);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:7px 13px;font-size:14px}

/* Découvrir */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:15px;font-weight:500;border:2px solid transparent;background:#fff}
.chip{--c:var(--ink);--t:#fff;background:#fff;border-color:var(--c);color:var(--ink);transition:background .15s,color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--c);color:var(--t);box-shadow:0 3px 0 rgba(23,20,15,.18)}
.chip.c-hist{--c:#c9a45a;--t:#17140f}
.chip.c-geo{--c:var(--green)}
.chip.c-soc{--c:#7a5fc4}
.chip.c-sci{--c:var(--navy)}
.chip.c-art{--c:var(--purple)}
.chip.c-pop{--c:var(--orange);--t:#17140f}
.chip.c-flt{background:var(--grey);border-color:transparent;padding:6px 10px}
.chip svg{width:20px;height:20px}
.chip .cnt{font-size:12px;font-weight:700;opacity:.7}
.chips.sub{margin-top:8px}
.chips.sub .chip{font-size:13.5px;padding:4px 11px;border-width:1.5px}
.search{display:flex;align-items:center;gap:8px;border-radius:14px;background:#fff;padding:0 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search input{border:0;outline:0;padding:12px 0;flex:1;background:transparent;min-width:0}
.alist{display:flex;flex-direction:column;gap:10px}
.aitem{display:flex;gap:12px;align-items:center;border:0;border-radius:16px;background:#fff;padding:12px 14px;text-align:left;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.aitem i{flex:0 0 10px;align-self:stretch;border-radius:5px}
.aitem .tt{flex:1;font-family:var(--f-serif);font-weight:800;font-size:16.5px;line-height:1.2}
.aitem .th{display:block;font-family:var(--f-sans);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.aitem .d{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lockline{display:flex;gap:10px;align-items:center;background:#fff3d4;border-radius:14px;padding:10px 12px;font-size:13.5px}
.lockline svg{flex:0 0 22px;height:22px}
.lockline p{margin:0;flex:1}
.empty{font-size:14.5px;color:var(--muted);text-align:center;padding:16px 10px;background:#fff;border-radius:16px}

/* Profil */
.pcard{background:var(--green);color:#fff;border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 18px rgba(23,20,15,.16)}
.pcard .top{display:flex;gap:14px;align-items:center}
.pcard .who{display:flex;flex-direction:column;gap:7px;min-width:0}
.pcard .nm{font-family:var(--f-serif);font-weight:800;font-size:28px;line-height:1}
.pcard .lvl{align-self:flex-start;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 11px;font-weight:700;font-size:14px}
.pcard .tiers{font-size:14.5px;line-height:1.25}
.quote{background:rgba(0,0,0,.14);border-radius:14px;padding:10px 12px;text-align:center;font-size:15px;line-height:1.3;margin:0}
.quote .src{font-size:11.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
.quote .txt{transition:opacity .35s}
.quote .txt.fade{opacity:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:18px;padding:12px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;box-shadow:0 6px 14px rgba(23,20,15,.14);position:relative;overflow:hidden}
.tile b{font-weight:900;font-size:25px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:13.5px;font-weight:700;line-height:1.2}
.tile small{font-size:13px;line-height:1.2;opacity:.92}
.tile.s{background:var(--yellow)}
.tile.e{background:var(--navy);color:#fff}
.tile.e img{position:absolute;right:6px;top:8px;width:46px;border-radius:6px}
.menu{background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.07);padding:4px 16px}
.menu button{width:100%;display:flex;gap:12px;align-items:center;border:0;background:none;padding:13px 0;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .ico{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center}
.menu .ico svg{width:20px;height:20px}
.menu .chev{width:18px;height:18px;flex:0 0 auto;color:#b5ad9f}
.menu .t{flex:1;font-size:16px;font-weight:500;line-height:1.2}
.menu .t small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.menu .t em{font-style:normal;font-size:14px;color:var(--muted)}

/* ---------- Lecteur ---------- */
.reader{position:absolute;inset:0;z-index:30;background:var(--ink);display:none;flex-direction:column}
.reader.on{display:flex}
.r-top{position:absolute;top:12px;right:12px;z-index:5}
.r-top button,.r-bot button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2);flex:0 0 auto}
.r-top button svg,.r-bot button svg{width:18px;height:18px}
.r-bot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--ink)}
.segs{display:flex;gap:3px;flex:1;min-width:0}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.segs i.on{background:var(--yellow)}
.r-bot .cnt{font-weight:700;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-bot .fav.on svg{fill:var(--red);stroke:var(--red)}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--cream)}
.slide > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel-frame{position:absolute;inset:0;border:5px solid var(--ink);pointer-events:none}
.stack{position:absolute;top:58px;left:14px;right:14px;display:flex;flex-direction:column;gap:9px;z-index:2}
.caption{background:#fff1c9;border:3px solid var(--ink);padding:8px 11px;font-family:var(--f-letter);font-size:17.5px;line-height:1.25;box-shadow:3px 3px 0 var(--ink)}
.caption.fact{background:#fff;border-left:10px solid var(--green)}
.caption .ctag{display:block;font-family:var(--f-sans);font-weight:900;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--green)}
.caption.react .ctag{color:var(--red)}
.caption.chap .ctag{color:var(--navy)}
.caption.conf{background:var(--ink);color:#fff;border-color:var(--ink);align-self:flex-start;padding:6px 11px}
.caption.conf .ctag{color:var(--yellow);margin:0}
.bubble{position:relative;max-width:78%;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 13px;font-family:var(--f-letter);font-size:18px;line-height:1.2}
.bubble.l{align-self:flex-start}
.bubble.r{align-self:flex-end}
.bubble::before,.bubble::after{content:"";position:absolute;bottom:-17px;width:0;height:0;border-style:solid}
.bubble.l::before{left:26px;border-width:17px 0 0 15px;border-color:var(--ink) transparent transparent transparent}
.bubble.l::after{left:29.5px;bottom:-11px;border-width:11px 0 0 10px;border-color:#fff transparent transparent transparent}
.bubble.r::before{right:26px;border-width:17px 15px 0 0;border-color:var(--ink) transparent transparent transparent}
.bubble.r::after{right:29.5px;bottom:-11px;border-width:11px 10px 0 0;border-color:#fff transparent transparent transparent}
.bubble.th{border-style:dashed}
.nav-arrow{position:absolute;top:50%;z-index:6;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;opacity:.9;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.nav-arrow svg{width:20px;height:20px}
.nav-arrow.prev{left:8px}.nav-arrow.next{right:8px}
.nav-arrow[hidden]{display:none}
@media (hover:none){.nav-arrow{display:none}}
.blurveil{position:absolute;inset:0;z-index:3;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 8%,#000 42%);mask-image:linear-gradient(to bottom,transparent 8%,#000 42%);background:rgba(250,246,238,.35)}
.paybox{position:absolute;left:14px;right:14px;bottom:22px;z-index:4;background:var(--green);color:#fff;border-radius:22px;padding:18px 16px 14px;box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.paybox h3{font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.08;margin:0;text-wrap:balance}
.paybox p{margin:0;font-size:14px;opacity:.92}
.paybox .later{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px;padding:4px}
.final{display:flex;align-items:center;justify-content:center;padding:70px 20px 24px;background:var(--fc,#1f8f5f)}
.ccard{width:100%;max-width:330px;background:var(--cream);border-radius:22px;box-shadow:0 14px 30px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;border:3px solid var(--ink)}
.ccard .hd{background:var(--yellow);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--ink)}
.ccard .hd span{font-weight:900;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase}
.ccard .hd em{font-style:normal;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.ccard .ph{padding:20px 18px 12px;font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.15;text-wrap:balance}
.ccard .src{font-size:12px;color:var(--muted);padding:0 18px 12px}
.ccard .ft{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}

/* ---------- Feuilles ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(23,20,15,.45);display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--cream);border-radius:26px 26px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--f-serif);font-weight:800;font-size:24px;line-height:1.08;margin:0;text-wrap:balance;padding-right:40px}
.sheet p{margin:0}
.sheet .x{position:relative;z-index:2;align-self:flex-end;margin-bottom:-44px;width:36px;height:36px;border-radius:50%;border:0;background:var(--grey);display:grid;place-items:center;padding:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:14px}
.field input{border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.field input:focus{border-color:var(--ink);outline:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--green);margin-top:1px;flex:0 0 auto}
table.mx{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff;border-radius:14px;overflow:hidden}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.mx th{font-size:12px;color:var(--muted)}
.mx td:nth-child(3){font-weight:700;color:var(--green-d)}
.plans{display:flex;gap:10px}
.plan{flex:1;border:2px solid var(--line);border-radius:16px;padding:12px;background:#fff;text-align:left}
.plan[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.plan b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.plan span{font-size:12.5px;color:var(--muted)}
.stripe{border:1.5px dashed #c9c1b0;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.stripe .fake{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:#aaa;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px}
.steps .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900;font-size:16px}

.seg{display:flex;background:var(--grey);border-radius:999px;padding:3px}

.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.qrbox{display:flex;gap:18px;align-items:center}
.qrbox img{flex:0 0 auto;border-radius:16px;border:3px solid var(--ink);background:#fffaf0}
.qrbox .steps{flex:1;margin:0}
.guide{display:flex;gap:12px;align-items:center}
.guide p{background:#fff;border-radius:16px;padding:10px 12px;font-size:15px;flex:1}
.bounce{display:inline-block;animation:b 1s ease-in-out infinite}
@keyframes b{50%{transform:translateY(5px)}}
.dates{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.day{flex:0 0 50px;height:68px;border:0;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.day .wd{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.day .dn{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day.done .dot{background:var(--green)}
.day.sel{background:var(--ink);color:#fff}
.day.sel .wd{color:#ccc}
.day.lock{background:var(--grey);color:#a49f97;box-shadow:none}
.day .lk{width:13px;height:13px}
.hnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hnav select{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px 10px;color:var(--ink)}
.iconbtn.sm{width:38px;height:38px}
.iconbtn:disabled{opacity:.3}
.hnav .btn{margin-left:auto}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month .wh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.month button{aspect-ratio:1;border:0;border-radius:11px;background:#fff;font-weight:700;font-variant-numeric:tabular-nums;position:relative;padding:0;font-size:14px}
.month button.done::after{content:"";position:absolute;bottom:4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--green)}
.month button.lock{background:var(--grey);color:#b0aaa0}
.month button.fut{opacity:.35;cursor:default}
.month button.sel{background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tierlist{display:flex;flex-direction:column;gap:8px}
.tierlist div{background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.tierlist div.cur{box-shadow:0 0 0 3px var(--green)}
.tierlist div.off{opacity:.5}
.tierlist b{font-size:15px}
.tierlist span{font-size:13px;color:var(--muted)}
.tierlist em{font-style:normal;font-size:14px}
.barrow{display:flex;flex-direction:column;gap:4px}
.barrow .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.barrow .bar{height:12px;background:var(--grey);border-radius:6px;overflow:hidden}
.barrow .bar i{display:block;height:100%;border-radius:6px}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(12px);z-index:90;background:var(--ink);color:#fff;padding:10px 15px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Production ---------- */
html,body{background:var(--cream)}
body{overscroll-behavior-y:none}
.phone{position:fixed;inset:0;margin:0 auto;max-width:520px;background:var(--cream);overflow:hidden;

  .banner{max-width:640px}
  /* Lecteur : la BD en planche */

  .reader.desk .track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:none;
    padding:76px max(32px,calc((100vw - 1180px)/2)) 48px;align-content:start}

<script>
"use strict";
/* =========================================================
   Le Sachoir — appli PWA (V1 gratuite, données locales)
   ========================================================= */
const ORDER = ["dossier", "actu", "cultureg", "insolite"];
const DESK = matchMedia("(min-width: 900px)");
const CLS = { dossier: "green", actu: "navy", cultureg: "orange", insolite: "red" };
const COLOR = { dossier: "#1f8f5f", actu: "#2f4fa2", cultureg: "#f2a33a", insolite: "#d9473a" };

const SERIE = [
  {name:"Le Débutant", min:1, max:2, items:["A ouvert l’appli par erreur. Reste pour la gloire.","Premier jour de lucidité. On y croit (un peu).","A décidé d’être moins bête aujourd’hui. Demain est un autre jour.","Motivation intacte (pour les 5 prochaines minutes).","En période d’essai intellectuel. Ne rien signer pour l’instant."]},
  {name:"L’Échauffement", min:3, max:6, items:["Un mirage de constance. 72h sans dire une seule bêtise.","Plusieurs jours de suite ? Votre mère serait enfin fière.","Commence à prendre des habitudes dangereuses pour l’ego.","Le cerveau chauffe, attention au claquage neuronal.","Bientôt une semaine de sociabilité nettement améliorée."]},
  {name:"La Constance", min:7, max:13, items:["Une semaine de culture. Votre cerveau réclame déjà des vacances.","7 jours sans scroller dans le vide. Un miracle médical.","La régularité d’un métronome (ou d’un chômeur insomniaque).","Une semaine complète. Vous méritez un diplôme en papier crépon.","L’addiction à l’intelligence commence officiellement ici."]},
  {name:"L’Habitude", min:14, max:29, items:["Quinzaine triomphale. Vous commencez à juger secrètement vos amis.","Deux semaines. Votre vocabulaire effraie désormais vos proches.","Officiellement prêt pour gagner “Questions pour un Champion”.","Ne répond plus aux questions existentielles que par des anecdotes historiques.","L’entourage commence à trouver cette soudaine érudition suspecte."]},
  {name:"Le Mois Plein", min:30, max:49, items:["Un mois de snobisme intellectuel. Même Socrate est jaloux.","30 jours. Votre QI a officiellement demandé une augmentation.","Un mois complet. Vous snobez ouvertement les gens normaux.","Vous avez lu plus ce mois-ci que durant toute votre scolarité.","Impossible de vous inviter à dîner sans subir une conférence de 40 minutes."]},
  {name:"L’Obsession", min:50, max:99, items:["50 jours. Votre canapé a porté plainte pour abandon.","Votre réveil sonne. Pas pour le sport : pour le Sachoir.","Ne dit plus “bonjour” mais “saviez-vous que…”.","Deux mois de culture. Vos amis ont créé un groupe WhatsApp sans vous.","A remplacé le café du matin par des anecdotes sur l’Empire byzantin."]},
  {name:"Le Centenaire", min:100, max:Infinity, items:["100 jours d’affilée. Vous êtes l’invité que tout le monde redoute.","Cent jours. Vous corrigez les profs d’histoire-géo dans la rue.","L’omniscience est proche. Le burn-out social aussi.","Vous êtes la raison pour laquelle on a inventé le mot “pédant”.","Vous avez officiellement terminé le jeu de la culture générale."]}
];
const SERIE_ZERO = {name:"Sans série", min:0, max:0, items:["Aucune série en cours. Le canapé vous salue."]};
const ERUDITION = [
  {name:"Le Touriste", min:1, max:9, items:["Curieux accidentel. Sait presque de quoi il parle (si on ne creuse pas trop).","A lu un truc une fois. S’en vante depuis 48 heures.","Culture générale équivalente à un emballage de Carambar.","En pleine phase d’illusion de compétence. Laissez-le rêver.","Sait des choses, mais a complètement oublié lesquelles."]},
  {name:"L’Initié", min:10, max:24, items:["Apprenti Sachant. Commence à placer “anachronique” au hasard.","Assez de culture pour briller, trop peu pour tenir un débat.","Sait exactement comment le KGB a perdu une guerre à cause du Pepsi.","Commence à agacer les gens avec des “En fait, techniquement…”.","Un vernis de culture qui craquelle dangereusement sous la pression."]},
  {name:"Le Connaisseur", min:25, max:49, items:["Expert de comptoir. A un avis très tranché sur la géopolitique antique.","Dangereusement proche de la vraie érudition. Fuyez.","Utilise l’imparfait du subjonctif de manière non ironique.","Ses amis soupirent dès qu’il commence une phrase par “Tu savais que…”.","Officiellement plus cultivé que 90% des influenceurs réunis."]},
  {name:"L’Érudit", min:50, max:99, items:["Érudit fatigant. Précise toujours “qu’historiquement, c’est plus complexe”.","50 dossiers. Son cerveau pèse désormais 4 kilos.","Ne regarde plus de séries, analyse des contextes géopolitiques.","Un savoir encyclopédique redouté dans tout le quartier.","Capable de ruiner une ambiance de fête avec une anecdote sur la peste noire."]},
  {name:"La Légende", min:100, max:Infinity, items:["Divinité de l’Olympe. Sait tout sur tout, mais galère avec le micro-ondes.","Puits de science absolue. Corrige les fautes de Wikipédia le dimanche.","A fusionné spirituellement avec la bibliothèque d’Alexandrie.","Même les professeurs d’université prennent des notes quand il parle.","L’incarnation du Sachoir. Le boss final de la culture G."]}
];
const ERU_ZERO = {name:"Page blanche", min:0, max:0, items:["Aucun dossier dévoré. Une page blanche, pleine de promesses."]};
const POLES = [
  {id:"hist", em:"📜", name:"Histoire", color:"#c9a45a", themes:["Histoire ancienne","Histoire moderne","Histoire de France","Grandes personnalités","Mythologies et religions"]},
  {id:"geo", em:"🌍", name:"Géopolitique & éco", color:"#1f8f5f", themes:["Géopolitique","Économie","Politique française","Entreprises et marques"]},
  {id:"soc", em:"🤔", name:"Société & idées", color:"#7a5fc4", themes:["Psychologie","Sociologie","Philosophie","Démographie","Société","Droit","Géographie"]},
  {id:"sci", em:"🧪", name:"Sciences", color:"#2f4fa2", themes:["Sciences physiques","L’univers","Sciences du vivant","Médecine et santé","Grandes découvertes","Écologie et climat","Informatique et numérique"]},
  {id:"art", em:"🎨", name:"Art & Culture", color:"#8a55b8", themes:["Histoire de l’art","Arts plastiques","Architecture","Littérature","Expression française"]},
  {id:"pop", em:"🎮", name:"Culture pop", color:"#f2a33a", themes:["Musique","Mode et luxe","Sports","Jeux vidéo"]}
];
const normTh = th => (th || "").replace(/['`]/g, "’").trim().toLowerCase();
const poleOf = th => POLES.find(p => p.themes.some(x => normTh(x) === normTh(th)));
const themeName = th => { for (const p of POLES) { const x = p.themes.find(x => normTh(x) === normTh(th)); if (x) return x; } return ""; };

/* ---------- Stockage local ---------- */
const KEY = "sachoir.v1";
const DEF = { visited: [], dossiers: [], reads: [], favs: [], name: "", installDone: false };
let ME = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return { ...DEF }; } })();
ME.favs = (ME.favs || []).filter(x => x.type !== "card"); delete ME.storyColor; delete ME.storyWm;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ME)); } catch (e) {} };

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const tierOf = (l, z, n) => n <= 0 ? z : l.find(t => n >= t.min && n <= t.max);
const nextTier = (l, n) => l.find(t => t.min > n);
const cap1 = s => s.replace(/^./, m => m.toUpperCase());
const parisDate = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris" }).format(d);
const TODAY = parisDate();
const shift = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtLong = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }).replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
function vibrate() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600); }
function streak() {
  const v = new Set(ME.visited); let d = v.has(TODAY) ? TODAY : shift(TODAY, -1), n = 0;
  while (v.has(d)) { n++; d = shift(d, -1); }
  return n;
}

/* ---------- Données ---------- */
let INDEX = [], CUR = null, TAB = "home", PICK = { serie: Math.floor(Math.random() * 5), eru: Math.floor(Math.random() * 5) };
const editionCache = {};
async function loadIndex() {
  const r = await fetch("editions/index.json", { cache: "no-cache" });
  INDEX = (await r.json()).editions || [];
}
async function loadEdition(date) {
  if (editionCache[date]) return editionCache[date];
  const r = await fetch(`editions/${date}/edition.json`, { cache: "no-cache" });
  const ed = await r.json();
  const entry = INDEX.find(e => e.date === date);
  const ok = new Set((entry?.formats || []).map(f => f.id));
  ed.formats = (ed.formats || []).filter(f => ok.has(f.id)).sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
  ed.formats.forEach(f => { f.url = entry.formats.find(x => x.id === f.id)?.url || ""; });
  ed.base = `editions/${date}/`;
  editionCache[date] = ed;
  return ed;
}
const imgUrl = (ed, file) => file ? ed.base + file : "";
const coverOf = (ed, f) => f.cover?.status === "done" ? imgUrl(ed, f.cover.file) : (f.cases?.[0]?.image?.status === "done" ? imgUrl(ed, f.cases[0].image.file) : "");

}

async function selectDate(date) {
  try { CUR = await loadEdition(date); } catch (e) { toast("Édition indisponible hors ligne"); return; }
  closeSheet(); setTab("home");
}
let HM = null; // mois affiché dans l'historique : [année, mois]
function openHistory() {
  const dates = new Set(INDEX.map(e => e.date));
  const [ty, tm] = TODAY.split("-").map(Number);
  if (!HM) { const c = (CUR ? CUR.date : TODAY).split("-").map(Number); HM = [c[0], c[1]]; }
  let days = "";
  for (let o = -14; o <= 0; o++) {
    const iso = shift(TODAY, o), has = dates.has(iso), dd = new Date(iso + "T12:00:00Z");
    days += `<button class="day ${CUR && iso === CUR.date ? "sel" : ""} ${has ? (ME.visited.includes(iso) ? "done" : "") : "lock"}" data-d="${iso}" ${has ? "" : "disabled"} aria-label="${fmtLong(iso)}${has ? "" : ", pas d’édition"}"><span class="wd">${dd.toLocaleDateString("fr-FR", { weekday: "short", timeZone: "UTC" }).replace(".", "")}</span><span class="dn">${dd.getUTCDate()}</span><span class="dot"></span></button>`;
  }
  const oldest = INDEX.length ? INDEX.map(e => e.date).sort()[0] : TODAY;
  const y0 = Math.min(+oldest.slice(0, 4), ty - 5);
  const years = []; for (let y = ty; y >= y0; y--) years.push(y);
  const MONTHS = Array.from({ length: 12 }, (_, i) => cap1(new Date(Date.UTC(2000, i, 1)).toLocaleDateString("fr-FR", { month: "long", timeZone: "UTC" })));
  const draw = () => {
    const [y, m] = HM, first = new Date(Date.UTC(y, m - 1, 1)), lead = (first.getUTCDay() + 6) % 7, dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(w => `<span class="wh">${w}</span>`).join("") + "<span></span>".repeat(lead), n = 0;
    for (let d = 1; d <= dim; d++) {
      const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`, has = dates.has(iso); if (has) n++;
      cells += `<button class="${iso > TODAY ? "fut" : has ? "" : "lock"} ${has && ME.visited.includes(iso) ? "done" : ""} ${CUR && iso === CUR.date ? "sel" : ""}" data-d="${iso}" ${has ? "" : "disabled"}>${d}</button>`;
    }
    $("#hMonth").innerHTML = cells;
    $("#hM").value = m; $("#hY").value = y;
    $("#hPrev").disabled = y <= y0 && m === 1;
    $("#hNext").disabled = y > ty || (y === ty && m >= tm);
    $("#hEmpty").hidden = n > 0;
    $("#hMonth").querySelectorAll("[data-d]:not([disabled])").forEach(b => b.onclick = () => selectDate(b.dataset.d));
  };
  const move = k => { let [y, m] = HM; m += k; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } if (y > ty || (y === ty && m > tm)) [y, m] = [ty, tm]; if (y < y0) [y, m] = [y0, 1]; HM = [y, m]; draw(); };
  openSheet(`<h3>Historique</h3><div class="dates" id="hDates">${days}</div>
    <div class="hnav"><button class="iconbtn sm" id="hPrev" aria-label="Mois précédent"><svg viewBox="0 0 24 24" fill="none" stroke="#17140f" stroke-width="2.6"><path d="M15 5l-7 7 7 7"/></svg></button>
      <select id="hM" aria-label="Mois">${MONTHS.map((n, i) => `<option value="${i + 1}">${n}</option>`).join("")}</select>
      <select id="hY" aria-label="Année">${years.map(y => `<option>${y}</option>`).join("")}</select>
      <button class="iconbtn sm" id="hNext" aria-label="Mois suivant"><svg viewBox="0 0 24 24" fill="none" stroke="#17140f" stroke-width="2.6"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="btn ghost sm" id="hToday">Aujourd’hui</button></div>
    <div class="month" id="hMonth"></div>
    <p class="sub" id="hEmpty" hidden>Aucune édition ce mois-ci. Le Sachoir n’était pas encore né, ou il dormait.</p>
    <div class="legend"><span><b style="color:var(--green)">●</b> Édition lue</span><span>Grisé : pas d’édition</span></div>`);
  draw();
  $("#hPrev").onclick = () => move(-1); $("#hNext").onclick = () => move(1);
  $("#hToday").onclick = () => { HM = [ty, tm]; draw(); };
  $("#hM").onchange = e => { HM = [HM[0], +e.target.value]; move(0); };
  $("#hY").onchange = e => { HM = [+e.target.value, HM[1]]; move(0); };
  const sc = $("#hDates"); sc.scrollLeft = sc.scrollWidth;
  sc.querySelectorAll("[data-d]:not([disabled])").forEach(b => b.onclick = () => selectDate(b.dataset.d));
  let x0 = null; const mo = $("#hMonth");
  mo.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  mo.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) move(dx < 0 ? 1 : -1); });
}

/* ---------- Lecteur ---------- */
let R = { ed: null, f: null, idx: 0, n: 0 };
function caseHTML(ed, c) {
  let cap = "";
  if (c.caption || c.kind === "conf") {
    const tag = c.tag || (c.kind === "fact" ? "Les faits" : c.kind === "react" ? "La réaction" : "");
    cap = `<div class="caption ${c.kind || ""}">${tag ? `<span class="ctag">${esc(tag)}</span>` : ""}${esc(c.caption || "")}</div>`;
  }
  const art = c.image?.status === "done" ? `<img class="panel" src="${imgUrl(ed, c.image.file)}" alt="" decoding="async">` : `<div class="wip">Dessin en cours…</div>`;
  return `${art}<div class="stack">${cap}${(c.bubbles || []).map(b => `<div class="bubble ${b.side === "r" ? "r" : "l"} ${b.thought ? "th" : ""}">${esc(b.text)}</div>`).join("")}</div><div class="panel-frame"></div>`;
}
function finalHTML(ed, f) {
  return `<div class="ccard"><div class="hd"><span>Pour briller en société</span><em>${fmtLong(ed.date).split(" ").slice(1).join(" ")}</em></div><div class="ph">${esc(f.final?.text || "")}</div><div class="src">${esc(f.label)} · ${esc(f.final?.source || "")}</div>
  <div class="ft"><button class="btn" data-act="back">Retour à l’édition</button></div></div>`;
}
function openReader(ed, fid) {
  const f = ed.formats.find(x => x.id === fid); if (!f) return;
  R = { ed, f, idx: 0, n: f.cases.length + 1 };
  const tr = $("#track");
  tr.innerHTML = f.cases.map(c => `<div class="slide">${caseHTML(ed, c)}</div>`).join("") + `<div class="slide final" style="--fc:${COLOR[f.id] || "#1f8f5f"}">${finalHTML(ed, f)}</div>`;
  tr.querySelectorAll("[data-act]").forEach(b => b.onclick = onAct);
  const desk = DESK.matches;
  $("#reader").classList.toggle("desk", desk);
  $("#reader").classList.add("on"); tr.scrollLeft = 0; tr.scrollTop = 0; updateReader(0, true);
  if (desk) {
    if (R.io) R.io.disconnect();
    R.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = [...tr.children].indexOf(e.target);
      if (i > R.idx) updateReader(i, true);
    }), { root: tr, threshold: 0.6 });
    [...tr.children].forEach(el => R.io.observe(el));
  }
  history.pushState({ reader: true }, "");
}
function updateReader(i, init) {
  const { ed, f } = R, total = f.cases.length; R.idx = i;
  let seg = ""; for (let k = 0; k <= total; k++) seg += `<i class="${k <= i ? "on" : ""}"></i>`;
  $("#segs").innerHTML = seg;
  $("#rCount").textContent = DESK.matches ? `${esc(f.label)} · ${total} cases` : (i >= total ? "Pour briller" : `${i + 1} / ${total}`);
  const fav = ME.favs.some(x => x.date === ed.date && x.fid === f.id && x.type === "bd");
  $("#rFav").classList.toggle("on", fav); $("#rFav").setAttribute("aria-pressed", fav);
  $("#rPrev").hidden = i === 0; $("#rNext").hidden = i === total;
  if (!init) vibrate();
  // progression
  let r = ME.reads.find(x => x.date === ed.date && x.fid === f.id);
  if (!r) { r = { date: ed.date, fid: f.id, theme: f.theme || "", max: 0 }; ME.reads.push(r); }
  r.max = Math.max(r.max, Math.min(i + 1, total));
  // série : lire l'édition du jour (2e case atteinte)
  if (ed.date === TODAY && i >= 1 && !ME.visited.includes(TODAY)) { ME.visited.push(TODAY); { const k = streak(); toast(`🔥 Série : ${k} jour${k > 1 ? "s" : ""}`); }; }
  // érudition : un Grand Dossier compte dès la case 5
  if (f.id === "dossier" && i >= 4 && !ME.dossiers.includes(ed.date)) { ME.dossiers.push(ed.date); toast(`📚 Dossier dévoré : ${ME.dossiers.length}`); }
  save();
  if (i === total && !DESK.matches && !ME.installDone && !sessionStorage.getItem("installAsked") && !matchMedia("(display-mode: standalone)").matches) { sessionStorage.setItem("installAsked", "1"); setTimeout(openInstall, 900); }
}
function closeReader() { $("#reader").classList.remove("on"); if (R.io) R.io.disconnect(); render(); }
let scT;
$("#track").addEventListener("scroll", () => { if (DESK.matches) return; clearTimeout(scT); scT = setTimeout(() => { const tr = $("#track"), i = Math.round(tr.scrollLeft / tr.clientWidth); if (i !== R.idx) updateReader(i); }, 60); });
function go(d) { const tr = $("#track"), i = Math.max(0, Math.min(R.n - 1, R.idx + d)); tr.scrollTo({ left: i * tr.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
$("#rPrev").onclick = () => go(-1); $("#rNext").onclick = () => go(1);
$("#rClose").onclick = () => history.back();
window.addEventListener("popstate", () => { if ($("#scrim").classList.contains("on")) closeSheet(); else if ($("#reader").classList.contains("on")) closeReader(); });
$("#rFav").onclick = () => { toggleFav(R.ed, R.f, "bd"); updateReader(R.idx, true); };
document.addEventListener("keydown", e => {
  if ($("#scrim").classList.contains("on")) { if (e.key === "Escape") closeSheet(); return; }
  if (!$("#reader").classList.contains("on")) return;
  if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (e.key === "Escape") history.back();
});
function toggleFav(ed, f, type) {
  const i = ME.favs.findIndex(x => x.date === ed.date && x.fid === f.id && x.type === type);
  if (i >= 0) { ME.favs.splice(i, 1); toast("Retiré des favoris"); }
  else { ME.favs.push({ date: ed.date, fid: f.id, type, title: f.title, label: f.label }); toast("Ajouté aux favoris ♥"); }
  save();
}
function onAct(e) {
  const a = e.currentTarget.dataset.act;
  if (a === "back") history.back();
}

}
function openTiers(type) {
  const list = type === "serie" ? SERIE : ERUDITION, n = type === "serie" ? streak() : ME.dossiers.length, cur = tierOf(list, {}, n);
  openSheet(`<h3>${type === "serie" ? "🔥 Vos paliers de série" : "📚 Vos paliers d’érudition"}</h3><p class="sub">${type === "serie" ? `${n} jour(s) consécutif(s)` : `${n} dossier(s) dévoré(s)`}</p>
   <div class="tierlist">${list.map(t => `<div class="${t === cur ? "cur" : t.min > n ? "off" : ""}"><b>${t.name}</b><span>${t.max === Infinity ? `${t.min} et +` : `${t.min} à ${t.max}`} ${type === "serie" ? "jours" : "dossiers"}</span>${t === cur ? `<em>« ${esc(t.items[0])} »</em>` : ""}</div>`).join("")}</div>`);
}
function openName() {
  openSheet(`<h3>Comment vous appelle-t-on ?</h3><form id="nmF" class="field"><label for="nmI">Prénom ou surnom</label><input type="text" id="nmI" maxlength="24" value="${esc(ME.name)}" autocomplete="given-name"></form><button class="cta" id="nmOk">Enregistrer</button><p class="sub">Il reste sur ce téléphone. Aucun compte n’est nécessaire.</p>`);
  const ok = () => { ME.name = $("#nmI").value.trim(); save(); closeSheet(); render(); };
  $("#nmOk").onclick = ok; $("#nmF").onsubmit = e => { e.preventDefault(); ok(); };
}
function openBilan() {
  const counts = POLES.map(p => ({ p, n: ME.reads.filter(r => r.max >= 1 && poleOf(r.theme) === p).length }));
  const max = Math.max(1, ...counts.map(c => c.n)), top = counts.slice().sort((a, b) => b.n - a.n)[0];
  openSheet(`<h3>📊 Mon Bilan de Culture G</h3><p class="sub">${ME.reads.length} histoire(s) ouverte(s), ${ME.dossiers.length} dossier(s) dévoré(s).</p>
   ${counts.map(({ p, n }) => `<div class="barrow"><div class="lbl"><span>${p.em} ${p.name}</span><span>${n}</span></div><div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:${p.color}"></i></div></div>`).join("")}
   <p class="sub">${top.n ? `Votre point fort : ${top.p.name}. Vos amis le savaient déjà.` : "Lisez quelques histoires pour voir apparaître vos points forts."}</p>`);
}
async function invite() {
  const data = { title: "Le Sachoir", text: "Chaque jour, l’actu et la culture G en BD. Pour briller en société.", url: location.origin + location.pathname };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(data.url); toast("Lien copié"); } catch (e) { toast(data.url); } }
}

/* ---------- Découvrir ---------- */
let EX = { pole: null, theme: null, q: "", search: false };
function allStories() {
  const out = [];
  INDEX.forEach(e => e.formats.forEach(f => { if (f.id !== "actu") out.push({ ...f, theme: themeName(f.theme), date: e.date, demo: e.demo }); }));
  return out;
}
/* Les filtres sont construits à partir des histoires publiées : un pôle ou une thématique
   n'apparaît que s'il a au moins une histoire, avec son nombre d'histoires. */
function renderExplore() {
  const v = $("#v-explore"), q = EX.q.toLowerCase();
  const all = allStories();
  const byQ = all.filter(s => !q || (s.title + " " + s.theme + " " + (s.tagline || "")).toLowerCase().includes(q));
  const poles = POLES.map(p => ({ p, n: byQ.filter(s => poleOf(s.theme) === p).length })).filter(x => x.n);
  const other = byQ.filter(s => !poleOf(s.theme)).length;
  if (EX.pole && EX.pole !== "other" && !poles.some(x => x.p.id === EX.pole)) { EX.pole = null; EX.theme = null; }
  if (EX.pole === "other" && !other) EX.pole = null;
  const cur = POLES.find(p => p.id === EX.pole);
  const themes = cur ? cur.themes.map(th => ({ th, n: byQ.filter(s => s.theme === th).length })).filter(x => x.n) : [];
  if (EX.theme && !themes.some(x => x.th === EX.theme)) EX.theme = null;
  const res = byQ.filter(s => !EX.pole || (EX.pole === "other" ? !poleOf(s.theme) : poleOf(s.theme)?.id === EX.pole))
                 .filter(s => !EX.theme || s.theme === EX.theme);
  const n = k => `<span class="cnt">${k}</span>`;
  v.innerHTML = `<div class="row" style="align-items:flex-start"><div><h1 class="h1">Découvrir</h1><p class="lead">Explorez nos dossiers (pour briller en société sans trop d’efforts)</p></div>
     <button class="iconbtn" id="exS" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="#17140f" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button></div>
   ${EX.search ? `<label class="search" for="exQ"><input id="exQ" type="search" placeholder="Napoléon, krach, quantique…" value="${esc(EX.q)}" aria-label="Rechercher"></label>` : ""}
   ${poles.length + (other ? 1 : 0) > 1 || EX.pole ? `<div class="chips" role="group" aria-label="Filtrer par pôle"><button class="chip c-all" data-p="" aria-pressed="${!EX.pole}">Tout ${n(byQ.length)}</button>${poles.map(({ p, n: k }) => `<button class="chip c-${p.id}" data-p="${p.id}" aria-pressed="${EX.pole === p.id}">${p.em} ${p.name} ${n(k)}</button>`).join("")}${other ? `<button class="chip c-all" data-p="other" aria-pressed="${EX.pole === "other"}">Autres ${n(other)}</button>` : ""}</div>` : ""}
   ${themes.length > 1 ? `<div class="chips sub" role="group" aria-label="Filtrer par thématique"><button class="chip c-${cur.id}" data-t="" aria-pressed="${!EX.theme}">Toutes</button>${themes.map(({ th, n: k }) => `<button class="chip c-${cur.id}" data-t="${esc(th)}" aria-pressed="${EX.theme === th}">${esc(th)} ${n(k)}</button>`).join("")}</div>` : ""}
   <div class="alist">${res.map(s => `<button class="aitem" data-d="${s.date}" data-f="${s.id}"><i style="background:${poleOf(s.theme)?.color || COLOR[s.id]}"></i><span class="tt">${esc(s.title)}<span class="th">${esc(s.label)}${s.theme ? " · " + esc(s.theme) : ""} · ${s.minutes || 2} min</span></span><span class="d">${new Date(s.date + "T12:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "short", timeZone: "UTC" })}</span></button>`).join("")}</div>
   ${res.length ? "" : `<p class="empty">Aucune histoire ne correspond. Les archives grandissent chaque jour.</p>`}`;
  $("#exS").onclick = () => { EX.search = !EX.search; renderExplore(); const i = $("#exQ"); if (i) i.focus(); };
  v.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { EX.pole = b.dataset.p || null; EX.theme = null; renderExplore(); });
  v.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { EX.theme = b.dataset.t || null; renderExplore(); });
  v.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { try { const ed = await loadEdition(b.dataset.d); openReader(ed, b.dataset.f); } catch (e) { toast("Indisponible hors ligne"); } });
  const inp = $("#exQ"); if (inp) inp.oninput = () => { EX.q = inp.value; const p = inp.selectionStart; renderExplore(); const n = $("#exQ"); n.focus(); n.setSelectionRange(p, p); };
}

/* ---------- Favoris ---------- */
function renderFavs() {
  const v = $("#v-favs");
  v.innerHTML = `<h1 class="h1">Favoris</h1><p class="lead">Vos histoires préférées, toujours sous la main.</p>
   ${ME.favs.length ? `<div class="alist">${ME.favs.slice().reverse().map(x => `<button class="aitem" data-d="${x.date}" data-f="${x.fid}" data-t="${x.type}"><i style="background:${COLOR[x.fid] || "#1f8f5f"}"></i><span class="tt">${esc(x.title)}<span class="th">${esc(x.label)}</span></span></button>`).join("")}</div>`
    : `<p class="empty">Touchez ♡ en bas de l’écran pendant une lecture pour garder une histoire.</p>`}`;
  v.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    try { const ed = await loadEdition(b.dataset.d); openReader(ed, b.dataset.f); }
    catch (e) { toast("Indisponible hors ligne"); }
  });
}

/* ---------- Profil ---------- */
function phraseOf(type) { const t = type === "serie" ? tierOf(SERIE, SERIE_ZERO, streak()) : tierOf(ERUDITION, ERU_ZERO, ME.dossiers.length); return t.items[PICK[type] % t.items.length]; }
function renderProfile() {
  const v = $("#v-profile"), s = streak(), st = tierOf(SERIE, SERIE_ZERO, s), et = tierOf(ERUDITION, ERU_ZERO, ME.dossiers.length);
  const I = (bg, fg, path) => `<span class="ico" style="background:${bg};color:${fg}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>`;
  v.innerHTML = `<div class="row"><h1 class="h1">Mon Profil</h1><button class="iconbtn" id="prName" aria-label="Changer de prénom"><svg viewBox="0 0 24 24" fill="none" stroke="#17140f" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
   <div class="pcard"><div class="top"><div class="who"><span class="nm">${ME.name ? esc(ME.name) : "Lecteur"}</span><span class="lvl">📚 ${esc(et.name)}</span><span class="tiers">${esc(phraseOf("eru"))}</span></div></div>
     <p class="quote">${esc(phraseOf("serie"))}</p></div>
   <div class="tiles"><button class="tile s" id="tS"><b>🔥 ${s} Jour${s > 1 ? "s" : ""}</b><span>De présence consécutive</span><small>${st.name}</small></button>
     <button class="tile e" id="tE"><b>📚 ${ME.dossiers.length}</b><span>Dossiers</span><small>Dévorés avec succès</small><img src="assets/books.png" alt=""></button></div>
   <div class="menu">
     <button id="m1">${I("#dff0e6", "#14704a", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')}<span class="t">Mon Bilan de Culture G<small>Vos thèmes forts, Histoire ou Sciences</small></span>${ICON.chev}</button>
     <button id="m2">${I("#e1e8f7", "#2f4fa2", '<path d="M6 3h12v18l-6-4-6 4z"/>')}<span class="t">Dossiers Enregistrés</span>${ICON.chev}</button>
     <button id="m3">${I("#fdebd2", "#b8650c", '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')}<span class="t">Newsletter quotidienne<small>Bientôt disponible</small></span>${ICON.chev}</button>
     <button id="m5">${I("#ece2f6", "#8a55b8", '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M18 8v6M15 11h6"/>')}<span class="t">Inviter des amis <em>(à devenir moins bêtes)</em></span>${ICON.chev}</button>
     <button id="m6">${I("#efebe3", "#17140f", '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8v6M9.5 11.5L12 14l2.5-2.5"/>')}<span class="t">Installer l’application</span>${ICON.chev}</button>
   </div>`;
  $("#prName").onclick = openName;
  $("#tS").onclick = () => openTiers("serie"); $("#tE").onclick = () => openTiers("eru");
  $("#m1").onclick = openBilan; $("#m2").onclick = () => setTab("favs"); $("#m3").onclick = () => toast("La newsletter arrive bientôt");
  $("#m5").onclick = invite; $("#m6").onclick = openInstall;
}

/* ---------- Démarrage ---------- */
$("#streakMini").onclick = () => openTiers("serie");
window.addEventListener("online", () => $("#offline").classList.remove("on"));
window.addEventListener("offline", () => $("#offline").classList.add("on"));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  try {
    await loadIndex();
    if (INDEX.length) {
      const wanted = new URLSearchParams(location.search).get("d");
      CUR = await loadEdition(wanted && INDEX.some(e => e.date === wanted) ? wanted : INDEX[0].date);
    }
    if (new URLSearchParams(location.search).has("install") && !matchMedia("(display-mode: standalone)").matches) setTimeout(openInstall, 600);
    const fid = new URLSearchParams(location.search).get("f");
    if (CUR && fid && CUR.formats.some(f => f.id === fid)) { render(); openReader(CUR, fid); return; }
  } catch (e) { if (!navigator.onLine) $("#offline").classList.add("on"); }
  render();
})();

</script>
</body>
</html>
