<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf6ee">
<meta name="sachoir-api" content="__API__">
<title>Tableau de bord · Le Sachoir</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,700;8..60,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf6ee;--ink:#17140f;--muted:#5f5a52;--green:#1f8f5f;--yellow:#f5b62a;--navy:#2f4fa2;--red:#d9473a;--line:#e7e1d4;--grey:#efebe3;
  --f-serif:"Source Serif 4",Georgia,serif;--f-sans:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-sans);font-size:15px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(250,246,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar img{height:30px}
.bar h1{font-family:var(--f-serif);font-weight:800;font-size:21px;margin:0;flex:1}
.seg{display:flex;background:var(--grey);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font:inherit;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;background:var(--yellow);border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.btn.ghost{background:var(--grey)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px;transition:opacity .2s}
main.loading{opacity:.55}
h2{font-family:var(--f-serif);font-weight:800;font-size:23px;margin:30px 0 4px}
h2+.note{margin:0 0 12px}
.note{color:var(--muted);font-size:13.5px;margin:4px 0 0;line-height:1.4}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.tile b{font-family:var(--f-serif);font-weight:800;font-size:30px;line-height:1.05}
.tile span{font-size:13.5px;color:var(--muted)}
.tile small{font-size:12.5px;color:var(--muted)}
.tile.alert{box-shadow:inset 0 0 0 2px var(--red)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:12px}
.card{background:#fff;border-radius:16px;padding:14px 16px 12px;min-width:0}
.card h3{font-size:15px;margin:0 0 2px;font-weight:700}
.card .note{margin:0 0 8px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted)}
.chart rect.m{cursor:default}
.chart g.hit:hover rect.m,.chart g.hit:focus rect.m{opacity:.75}
.chart g.hit:focus{outline:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;opacity:0;transition:opacity .1s;z-index:3}
.tip b{font-size:14px;display:block}
.tip.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--grey)}
.pill.ok{background:#dff0e6;color:#14704a}.pill.ko{background:#fbe3e0;color:#a3291f}.pill.wait{background:#fff1d1;color:#8a5a00}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],input[type=date]{font:inherit;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.gate{max-width:440px;margin:12vh auto;background:#fff;border-radius:22px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate h1{font-family:var(--f-serif);font-weight:800;font-size:26px;margin:0}
iframe{width:100%;height:760px;border:0;border-radius:12px;background:var(--cream)}
.issues{margin:0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;opacity:0;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
/* BD à venir */
.qrow{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.qrow:hover{background:var(--cream)}
.qrow:last-child{border-bottom:0}
.qrow .pill{flex:0 0 auto}.qrow .tt{flex:1;min-width:0}.qrow .tt b{display:block;font-size:15px}.qrow .tt span{font-size:12.5px;color:var(--muted)}
.prog{width:110px;flex:0 0 auto}.prog i{display:block;height:6px;border-radius:3px;background:var(--grey);overflow:hidden}.prog i b{display:block;height:100%;background:var(--green)}
.prog span{font-size:11.5px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(23,20,15,.55);display:none;overflow:auto;padding:24px 12px}
.viewer.on{display:block}
.vin{max-width:640px;margin:0 auto;background:var(--cream);border-radius:22px;padding:18px 16px 30px;position:relative}
.vin .x{position:sticky;top:0;float:right;border:0;background:var(--grey);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.vin h2{margin:4px 0 6px}
.vcase{background:#fff;border-radius:16px;margin:12px 0;overflow:hidden}
.vcase img{display:block;width:100%;height:auto;background:var(--grey)}
.vcase .ph0{aspect-ratio:9/16;max-height:340px;background:repeating-linear-gradient(45deg,#efebe3,#efebe3 10px,#f6f2ea 10px,#f6f2ea 20px);display:grid;place-items:center;color:var(--muted);font-size:14px}
.vcase .txt{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.4}
.vcase .tag{align-self:flex-start;background:var(--yellow);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;text-transform:uppercase}
.vcase .bub{background:var(--cream);border-radius:12px;padding:6px 10px}.vcase .bub.r{align-self:flex-end}
.vcase details{font-size:12.5px;color:var(--muted)}.vcase details summary{cursor:pointer}
.cast{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.cast figure{margin:0;flex:0 0 96px;text-align:center;font-size:11.5px;color:var(--muted)}.cast img{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--grey)}
.prow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow:last-child{border-bottom:0}.prow.off .tt{opacity:.45}.prow .tt{flex:1;min-width:200px}.prow .tt b{display:block;font-size:14.5px}.prow .tt span{font-size:12.5px;color:var(--muted)}
.prow .btn{padding:7px 12px;font-size:13.5px}
.qz li{margin:6px 0}.qz .ok{font-weight:700;color:var(--green)}
@media (max-width:600px){.cards{grid-template-columns:1fr}.tile b{font-size:26px}}
</style>
</head>
<body>
<header><div class="bar"><a href="./"><img src="assets/logo.png" alt="Le Sachoir"></a><h1 id="ttl">Tableau de bord</h1>
  <div class="seg" id="views" role="group" aria-label="Page"><button data-v="" aria-pressed="true">Indicateurs</button><button data-v="bd">BD à venir</button><button data-v="pub">BD publiées</button></div>
  <div class="seg" id="range" role="group" aria-label="Période"><button data-d="7">7 jours</button><button data-d="30" aria-pressed="true">30 jours</button><button data-d="90">90 jours</button></div>
  <button class="btn ghost" id="refresh">Actualiser</button></div></header>
<main id="main"><p class="note">Chargement…</p></main>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer" onclick="if(event.target===this)this.classList.remove('on')"><div class="vin"><button class="x" onclick="document.getElementById('viewer').classList.remove('on')" aria-label="Fermer">×</button><div id="vbody"></div></div></div>
<script>
const $ = s => document.querySelector(s);
const API = (document.querySelector('meta[name="sachoir-api"]').content || "").replace(/\/+$/, "");
let ACC = null; try { ACC = JSON.parse(localStorage.getItem("sachoir.acc") || "null"); } catch (e) {}
let DAYS = 30, K = null, TITLES = {}, STATUS = null;
const esc = t => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const nf = n => (+n || 0).toLocaleString("fr-FR");
const euro = c => ((+c || 0) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const pct = (a, b) => b ? Math.round(100 * a / b) + " %" : "—";
const shift = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dShort = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "short", timeZone: "UTC" });
const dLong = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
const LBL = { dossier: "Le Grand Dossier", actu: "L’Actu du jour", cultureg: "Culture G", insolite: "Insolite", quiz: "Le jeu du jour" };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2800); }

async function api(path, opts = {}) {
  const r = await fetch(API + path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: { "content-type": "application/json", authorization: "Bearer " + (ACC?.session || "") }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || "Erreur " + r.status); e.status = r.status; throw e; }
  return d;
}
function gate(title, text) {
  document.querySelector("header").hidden = true;
  $("#main").innerHTML = `<div class="gate"><img src="assets/logo.png" alt="" height="34"><h1>${esc(title)}</h1><p class="note">${text}</p><a class="btn" href="./">Ouvrir l’appli</a></div>`;
}

/* Barres d'une seule série, une par jour (ou par catégorie), avec infobulle au survol et au clavier. */
function bars(data, { h = 150, color = "#1f8f5f", unit = "" } = {}) {
  const W = 640, pad = { l: 30, r: 4, t: 8, b: 22 }, n = data.length, iw = W - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(1, ...data.map(d => d.v)), step = Math.max(1, niceStep(max)), top = Math.ceil(max / step) * step;
  const bw = iw / n, gap = Math.min(2, bw * .25), y = v => pad.t + ih - ih * v / top;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "#efebe3" : "#d8d1c3"}" stroke-width="1"/><text class="ax" x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end">${nf(v)}</text>`;
  const every = Math.ceil(n / 8);
  data.forEach((d, i) => {
    const x = pad.l + i * bw, bh = Math.max(0, ih * d.v / top), w = Math.max(1, bw - gap), r = Math.min(4, w / 2, bh);
    const path = bh ? `M${x + gap / 2},${y(0)} v${-(bh - r)} q0,${-r} ${r},${-r} h${w - 2 * r} q${r},0 ${r},${r} v${bh - r} z` : "";
    s += `<g class="hit" tabindex="0" data-i="${i}"><rect x="${x}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent"/>${path ? `<path class="m" d="${path}" fill="${color}"/>` : ""}</g>`;
    if (i % every === 0 || i === n - 1 && n <= 12) s += `<text class="ax" x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  s += `</svg>`;
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const tip = el.querySelector(".tip");
    const show = g => { const d = data[+g.dataset.i], bb = g.getBoundingClientRect(), cb = el.getBoundingClientRect(); tip.innerHTML = ""; const b = document.createElement("b"); b.textContent = nf(d.v) + unit; tip.append(b, document.createTextNode(d.tip || d.l)); tip.style.left = (bb.left - cb.left + bb.width / 2) + "px"; tip.style.top = Math.max(18, y(d.v) / h * cb.height) + "px"; tip.classList.add("on"); };
    el.querySelectorAll("g.hit").forEach(g => { g.onpointerenter = () => show(g); g.onfocus = () => show(g); g.onpointerleave = g.onblur = () => tip.classList.remove("on"); });
  });
  return `<div class="chart" id="${id}">${s}<div class="tip"></div></div>`;
}
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 5, 10].map(k => k * p).find(k => k >= raw) || p; }
function series(rows, key = "n") {
  const m = Object.fromEntries((rows || []).map(r => [r.day, r[key]]));
  return Array.from({ length: DAYS }, (_, i) => { const d = shift(K.today, i - DAYS + 1); return { l: dShort(d), tip: dLong(d), v: m[d] || 0 }; });
}
const evSeries = (type, key = "u") => series(K.events.filter(e => e.type === type), key);
const evTotal = (type, key = "n") => K.events.filter(e => e.type === type).reduce((t, e) => t + e[key], 0);
const tile = (v, label, sub = "", cls = "") => `<div class="tile ${cls}"><b>${v}</b><span>${esc(label)}</span>${sub ? `<small>${sub}</small>` : ""}</div>`;
const card = (title, note, body) => `<div class="card"><h3>${esc(title)}</h3>${note ? `<p class="note">${note}</p>` : ""}${body}</div>`;

async function load() {
  $("#main").classList.add("loading");
  try {
    const [k, idx, st] = await Promise.all([api(`/admin/kpi?days=${DAYS}`), fetch("editions/index.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({ editions: [] })), fetch("status.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)]);
    K = k; STATUS = st;
    TITLES = {}; (idx.editions || []).forEach(e => e.formats.forEach(f => { TITLES[e.date + "|" + f.id] = f.title; }));
    draw();
  } catch (e) {
    if (e.status === 401) return gate("Session expirée", "Reconnectez-vous dans l’appli (Profil › Mon compte), puis revenez ici.");
    if (e.status === 403) return gate("Accès réservé", "Ce compte n’est pas administrateur. Ajoutez son adresse dans <code>ADMIN_EMAILS</code> (worker/wrangler.toml).");
    $("#main").innerHTML = `<p class="note">Impossible de charger les indicateurs : ${esc(e.message)}</p>`;
  } finally { $("#main").classList.remove("loading"); }
}

function draw() {
  const A = K.audience, C = K.accounts, N = K.newsletter;
  const reads = evTotal("read"), done = evTotal("done");
  const mailsToday = K.mails.today.reduce((t, m) => t + m.n, 0);
  const fmtRows = ["dossier", "actu", "cultureg", "insolite"].map(id => K.formats.find(f => f.fid === id) || { fid: id, opens: 0, done: 0, depth: null });
  const runs = N.runs || [];
  const lastRun = runs[0];
  const st = STATUS || {};
  const issues = st.problems || [];
  $("#main").innerHTML = `
  <h2>La chaîne de publication</h2><p class="note">État publié par le pipeline (status.json).</p>
  <div class="grid">
    ${tile(st.today_published ? "En ligne" : "Pas encore", "Édition du jour", st.today_stories ? esc(st.today_stories.map(x => LBL[x] || x).join(" · ")) : esc(dLong(K.today)), STATUS && !st.today_published ? "alert" : "")}
    ${["dossier", "cultureg", "insolite"].map(t => st.stock?.[t] ? tile(nf(st.stock[t].ready), "BD prêtes : " + LBL[t], `${nf(st.stock[t].waiting)} en file · ${nf(st.stock[t].images_left)} image(s) à dessiner`, st.stock[t].ready < 1 ? "alert" : "") : "").join("")}
    ${tile(lastRun ? (lastRun.day === K.today ? (lastRun.status === "sent" ? "Envoyée" : lastRun.status === "failed" ? "Échec" : "En cours") : "Pas encore") : "Jamais", "Newsletter du jour", lastRun?.day === K.today ? nf(lastRun.recipients) + " destinataire(s)" : "part dès que l’édition est publiée", lastRun?.day === K.today && lastRun.status === "failed" ? "alert" : "")}
    ${tile(`${nf(mailsToday)} / ${nf(K.mails.limit)}`, "E-mails envoyés aujourd’hui", "quota gratuit Brevo", mailsToday > K.mails.limit * .85 ? "alert" : "")}
  </div>
  ${issues.length ? `<div class="card" style="margin-top:12px"><h3>Problèmes signalés</h3><ul class="issues">${issues.map(i => `<li>${esc(typeof i === "string" ? i : i.message || JSON.stringify(i))}</li>`).join("")}</ul></div>` : ""}

  <h2>Audience</h2><p class="note">Téléphones et ordinateurs anonymes (un identifiant tiré au hasard par appareil, ni cookie ni IP). « Do Not Track » respecté.</p>
  <div class="grid">
    ${tile(nf(A.dau), "Lecteurs aujourd’hui")}
    ${tile(nf(A.wau), "Lecteurs sur 7 jours")}
    ${tile(nf(A.mau), "Lecteurs sur 30 jours", A.wau && A.mau ? `fidélité 7 j / 30 j : ${pct(A.wau, A.mau)}` : "")}
    ${tile(nf(A.newDevices.reduce((t, r) => t + r.n, 0)), "Nouveaux lecteurs", `sur ${DAYS} jours`)}
    ${tile(pct(A.app30, A.devices30), "Appli installée", `${nf(A.app30)} sur ${nf(A.devices30)} appareils · ${pct(A.pc30, A.devices30)} sur PC`)}
    ${tile(A.retention.cohort ? pct(A.retention.d1, A.retention.cohort) : "—", "Reviennent le lendemain", A.retention.cohort ? `J+7 : ${pct(A.retention.d7, A.retention.cohort)} (cohorte de ${nf(A.retention.cohort)})` : "pas encore assez de recul (14 jours)")}
  </div>
  <div class="cards">
    ${card("Lecteurs par jour", "Appareils qui ont ouvert l’appli.", bars(series(A.daily)))}
    ${card("Nouveaux lecteurs par jour", "Première visite de l’appareil.", bars(series(A.newDevices), { color: "#2f4fa2" }))}
  </div>

  <h2>Lecture et engagement</h2><p class="note">Sur ${DAYS} jours : ${nf(reads)} BD ouvertes, ${nf(done)} lues jusqu’à la carte « Pour briller ».</p>
  <div class="cards">
    ${card("Par format", "Lue jusqu’au bout = carte finale atteinte. Profondeur = part des cases vues en moyenne.", `<div class="scroll"><table><thead><tr><th>Format</th><th class="n">Ouvertures</th><th class="n">Lues jusqu’au bout</th><th class="n">Profondeur</th></tr></thead><tbody>
      ${fmtRows.map(f => `<tr><td>${esc(LBL[f.fid])}</td><td class="n">${nf(f.opens)}</td><td class="n">${pct(f.done, f.opens)}</td><td class="n">${f.depth == null ? "—" : Math.round(f.depth) + " %"}</td></tr>`).join("")}</tbody></table></div>`)}
    ${card("BD les plus lues", "Lecteurs uniques sur la période.", `<div class="scroll"><table><thead><tr><th>Histoire</th><th class="n">Lecteurs</th><th class="n">Au bout</th><th class="n">♥</th><th class="n">Partages</th></tr></thead><tbody>
      ${K.top.length ? K.top.map(t => `<tr><td>${esc(TITLES[t.ed + "|" + t.fid] || LBL[t.fid] || t.fid)}<br><span class="note">${esc(LBL[t.fid] || t.fid)} · ${esc(dShort(t.ed))}</span></td><td class="n">${nf(t.readers)}</td><td class="n">${pct(t.done, t.readers)}</td><td class="n">${nf(t.favs)}</td><td class="n">${nf(t.shares)}</td></tr>`).join("") : `<tr><td colspan="5" class="note">Pas encore de lecture mesurée.</td></tr>`}</tbody></table></div>`)}
    ${card("Joueurs du jeu du jour", `${nf(evTotal("game"))} parties sur la période.`, bars(evSeries("game"), { color: "#14275c" }))}
    ${card("Gestes", "Totaux sur la période.", `<div class="grid" style="grid-template-columns:repeat(2,1fr)">${tile(nf(evTotal("fav")), "Favoris ajoutés")}${tile(nf(evTotal("share")), "Partages")}${tile(nf(evTotal("install")), "Installations")}${tile(nf(evTotal("paywall")), "Paywall vu", "seulement si les verrous Premium sont actifs")}</div>`)}
  </div>

  <h2>Comptes</h2>
  <div class="grid">
    ${tile(nf(C.n), "Comptes")}
    ${tile(nf(C.new7), "Nouveaux (7 jours)")}
    ${tile(nf(C.active7), "Actifs (7 jours)", C.n ? pct(C.active7, C.n) + " des comptes" : "")}
    ${tile(nf(C.premium), "Premium", "donné à la main en attendant Stripe")}
    ${tile(nf(C.bestStreak), "Meilleure série en cours", "jours consécutifs")}
  </div>
  <div class="cards">
    ${card("Inscriptions par jour", "", bars(series(C.daily), { color: "#f5b62a" }))}

    ${card("Érudition (comptes)", "Nombre de comptes par nombre de Grands Dossiers dévorés.", bars(C.erudition.map(s => ({ l: s.label, tip: s.label + " dossier(s)", v: s.n })), { color: "#1f8f5f" }))}
  </div>

  <h2>Newsletter</h2>
  <div class="grid">
    ${tile(nf(N.active), "Abonnés actifs")}
    ${tile(nf(N.new7), "Nouveaux (7 jours)")}
    ${tile(nf(N.unsub30), "Désinscrits (30 jours)", N.unsub ? nf(N.unsub) + " au total" : "")}
    ${tile(runs.length ? pct(runs.reduce((t, r) => t + r.opened, 0), runs.reduce((t, r) => t + r.sent, 0)) : "—", "Taux d’ouverture", "3 dernières semaines · sous-estimé (images bloquées)")}
    ${tile(runs.length ? pct(runs.reduce((t, r) => t + r.clicked, 0), runs.reduce((t, r) => t + r.sent, 0)) : "—", "Taux de clic", "3 dernières semaines")}
  </div>
  <div class="cards">
    ${card("Envois", "", `<div class="scroll"><table><thead><tr><th>Jour</th><th>Statut</th><th class="n">Envoyés</th><th class="n">Ouverts</th><th class="n">Cliqués</th></tr></thead><tbody>
      ${runs.length ? runs.map(r => `<tr><td>${esc(dShort(r.day))}${r.error ? `<br><span class="note">${esc(r.error)}</span>` : ""}</td><td><span class="pill ${r.status === "sent" ? "ok" : r.status === "failed" ? "ko" : "wait"}">${r.status === "sent" ? "Envoyée" : r.status === "failed" ? "Échec" : "En cours"}</span></td><td class="n">${nf(r.sent)}</td><td class="n">${pct(r.opened, r.sent)}</td><td class="n">${pct(r.clicked, r.sent)}</td></tr>`).join("") : `<tr><td colspan="5" class="note">Aucun envoi pour l’instant.</td></tr>`}</tbody></table></div>`)}
    ${card("Nouveaux abonnés par jour", "", bars(series(N.daily), { color: "#2f4fa2" }))}
  </div>
  <div class="card" style="margin-top:12px"><h3>Newsletter du jour</h3><p class="note">Elle part toute seule dès que l’édition est publiée (vérification toutes les 30 min, de 5 h à 11 h). Ces boutons servent à vérifier ou à rattraper un envoi.</p>
    <div class="row"><button class="btn ghost" id="nlPrev">Aperçu</button><button class="btn ghost" id="nlTest">M’envoyer un test</button><button class="btn" id="nlSend">Envoyer maintenant</button></div>
    <div id="nlBox"></div></div>

  <h2>Premium et dossiers offerts</h2><p class="note">${K.revenue.stripe ? "Abonnements Stripe actifs (mensuel ou annuel, sans engagement)." : "Stripe pas encore branché : ajoutez le secret STRIPE_SECRET_KEY pour ouvrir le paiement et le paywall."}</p>
  <div class="grid">
    ${tile(nf(K.subscriptions.byPlan.reduce((t, x) => t + x.n, 0)), "Abonnés payants", K.subscriptions.byPlan.map(x => `${nf(x.n)} ${x.plan === "year" ? "annuel(s)" : "mensuel(s)"}`).join(" · ") || "aucun pour l'instant")}
    ${tile(euro(K.subscriptions.mrrCents), "Revenu mensuel récurrent", "annuels comptés au douzième")}
    ${tile(nf(K.subscriptions.byPlan.reduce((t, x) => t + (x.ending || 0), 0)), "Résiliations programmées", `${nf(K.subscriptions.churned)} abonnement(s) terminé(s) sur la période`)}
    ${tile(nf(K.subscriptions.byPlan.reduce((t, x) => t + (x.late || 0), 0)), "Paiements en échec", "Stripe relance la carte", K.subscriptions.byPlan.some(x => x.late) ? "alert" : "")}
    ${tile(euro(K.revenue.byPlan.reduce((t, x) => t + x.cents, 0)), "Encaissé sur la période", K.revenue.byPlan.map(x => `${nf(x.n)} × ${x.plan === "year" ? "1 an" : "1 mois"}`).join(" · ") || "aucun paiement")}
    ${tile(euro(K.revenue.totalCents), "Revenus depuis le début", nf(K.revenue.totalCount) + " paiement(s)")}
    ${tile(nf((K.credits.grants.find(g => g.reason === "newsletter") || {}).n || 0), "Dossiers offerts (newsletter)", `sur ${DAYS} jours`)}
    ${tile(nf((K.credits.grants.find(g => g.reason === "referral") || {}).n || 0), "Dossiers offerts (parrainage)", `sur ${DAYS} jours`)}
    ${tile(nf(K.credits.unlocks), "Dossiers débloqués", `sur ${DAYS} jours`)}
    ${tile(nf(K.newsletter.pending), "Abonnés à confirmer", "e-mail de confirmation pas encore cliqué")}
  </div>
  <div class="cards">${card("Revenus par jour", "En euros, paiements validés.", bars(series(K.revenue.daily).map(d => ({ ...d, v: Math.round(d.v / 100) })), { color: "#1f8f5f", unit: " €" }))}</div>

  <h2>Utilisateurs et Premium</h2><p class="note">En attendant Stripe, le Premium se donne ici à la main, avec ou sans date de fin.</p>
  <div class="card"><div class="row" style="margin-bottom:8px"><input type="search" id="uq" placeholder="Rechercher un e-mail ou un prénom" style="flex:1;min-width:200px"></div><div class="scroll" id="users"><p class="note">Chargement…</p></div></div>
  <p class="note" style="margin-top:26px">Données du ${esc(dLong(K.today))}. Période : ${DAYS} jours.</p>`;

  $("#nlPrev").onclick = async () => { try { const d = await api("/admin/newsletter/preview"); $("#nlBox").innerHTML = `<p class="note" style="margin:10px 0 6px"><b>Objet :</b> ${esc(d.subject)}</p><iframe sandbox title="Aperçu de la newsletter"></iframe>`; $("#nlBox iframe").srcdoc = d.html; } catch (e) { toast(e.message); } };
  $("#nlTest").onclick = async e => { e.target.disabled = true; try { const d = await api("/admin/newsletter", { body: { action: "test" } }); toast(d.ok ? "Test envoyé à " + d.test : d.error || d.skipped); } catch (er) { toast(er.message); } e.target.disabled = false; };
  let armed = false;
  $("#nlSend").onclick = async e => {
    if (!armed) { armed = true; e.target.textContent = `Confirmer l’envoi à ${nf(N.active)} abonné(s)`; return; }
    e.target.disabled = true;
    try { const d = await api("/admin/newsletter", { body: { action: "send" } }); toast(d.ok ? `Envoyée à ${d.recipients} abonné(s)` : d.skipped || d.error); load(); } catch (er) { toast(er.message); e.target.disabled = false; }
  };
  let qt; $("#uq").oninput = e => { clearTimeout(qt); qt = setTimeout(() => users(e.target.value), 250); };
  users("");
}

async function users(q) {
  try {
    const d = await api("/admin/users?q=" + encodeURIComponent(q));
    $("#users").innerHTML = `<table><thead><tr><th>Compte</th><th>Inscrit</th><th>Vu</th><th>Newsletter</th><th>Premium</th></tr></thead><tbody>
      ${d.users.length ? d.users.map((u, i) => `<tr><td><b>${esc(u.email)}</b>${u.name ? `<br><span class="note">${esc(u.name)}</span>` : ""}</td><td>${esc(dShort(u.created_at.slice(0, 10)))}</td><td>${u.last_seen ? esc(dShort(u.last_seen.slice(0, 10))) : "—"}</td>
        <td>${u.nl === "active" ? `<span class="pill ok">Abonné</span>` : u.nl === "unsub" ? `<span class="pill">Désinscrit</span>` : "—"}</td>
        <td>${u.sub_plan && u.sub_status !== "canceled" ? `<span class="pill ${u.sub_status === "past_due" ? "ko" : "ok"}">${u.sub_plan === "year" ? "Annuel" : "Mensuel"}${u.sub_cancel_at_end ? " · résilié" : ""}</span> ` : ""}<div class="row"><label class="row" style="gap:5px;cursor:pointer"><input type="checkbox" data-u="${i}" ${u.premium ? "checked" : ""}>${u.premium_on ? `<span class="pill ok">Actif</span>` : u.premium ? `<span class="pill ko">Expiré</span>` : ""}</label>
          <input type="date" data-until="${i}" value="${esc(u.premium_until || "")}" title="Date de fin (vide = sans fin)" aria-label="Fin du Premium"></div></td></tr>`).join("") : `<tr><td colspan="5" class="note">Aucun compte${q ? " ne correspond" : " pour l’instant"}.</td></tr>`}</tbody></table>`;
    const set = async i => {
      const u = d.users[i], premium = $(`[data-u="${i}"]`).checked, until = $(`[data-until="${i}"]`).value;
      try { await api("/admin/users", { body: { email: u.email, premium, premium_until: until || null } }); toast(premium ? `Premium donné à ${u.email}` : `Premium retiré à ${u.email}`); users(q); }
      catch (e) { toast(e.message); }
    };
    $("#users").querySelectorAll("[data-u]").forEach(c => c.onchange = () => set(+c.dataset.u));
    $("#users").querySelectorAll("[data-until]").forEach(c => c.onchange = () => { if ($(`[data-u="${c.dataset.until}"]`).checked) set(+c.dataset.until); });
  } catch (e) { $("#users").innerHTML = `<p class="note">${esc(e.message)}</p>`; }
}

/* ---------- BD à venir ---------- */
const TYPES = { dossier: "Grands Dossiers", cultureg: "Culture G", insolite: "Insolites" };
const QSTATUS = { ready: ["ok", "Prête"], waiting: ["wait", "En dessin"], blocked: ["ko", "Bloquée"] };
const prog = r => `<div class="prog"><i><b style="width:${r.images_total ? Math.round(100 * r.images_done / r.images_total) : 0}%"></b></i><span>${nf(r.images_done)} / ${nf(r.images_total)} images${r.redo ? ` · ${r.redo} à refaire` : ""}${r.failed ? ` · ${r.failed} en échec` : ""}</span></div>`;
async function loadQueue() {
  $("#main").classList.add("loading");
  try {
    const q = await api("/admin/queue");
    const kinds = ["dossier", "cultureg", "insolite"];
    $("#main").innerHTML = `
    <h2>La file d'attente</h2><p class="note">Index mis à jour à chaque publication (${esc(new Date(q.updated_at).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}). Les BD sortent dans l'ordre, une de chaque type par jour, dès qu'elles sont dessinées à 100 %.</p>
    <div class="grid">${kinds.map(k => { const l = q.stock[k] || []; const rd = l.filter(r => r.status === "ready").length; return tile(`${nf(rd)} / ${nf(l.length)}`, TYPES[k] + " prêtes", `${nf(l.filter(r => r.status === "waiting").length)} en dessin · ${nf(l.filter(r => r.status === "blocked").length)} bloquée(s) · ${nf(l.reduce((t, r) => t + ((r.images_total || 0) - (r.images_done || 0)), 0))} image(s) à faire`, rd < 1 ? "alert" : ""); }).join("")}</div>
    <div class="cards">${kinds.map(k => card(TYPES[k], "", (q.stock[k] || []).length ? (q.stock[k]).map(r => `<div class="qrow" data-dir="${esc(r.path)}" tabindex="0">
        <span class="pill ${QSTATUS[r.status][0]}">${r.next ? "Sort en prochain" : QSTATUS[r.status][1]}</span>
        <div class="tt"><b>${esc(r.title)}</b><span>${esc(r.theme || "")}${r.minutes ? ` · ${r.minutes} min` : ""}${r.cases ? ` · ${r.cases} cases` : ""}${r.photos ? ` · ${r.photos} photo(s)` : ""}${r.error ? " · " + esc(r.error) : ""}</span></div>${r.images_total ? prog(r) : ""}</div>`).join("") : `<p class="note">File vide.</p>`)).join("")}</div>
    <h2>Les prochaines éditions</h2><p class="note">L'Actu et le jeu sont écrits par date ; les autres BD rejoignent l'édition le matin même, depuis la file.</p>
    <div class="card">${q.editions.map(e => `<div class="qrow" data-dir="${esc(e.path)}" tabindex="0"><span class="pill ${e.status === "published" ? "ok" : ""}">${e.status === "published" ? "En ligne" : "Brouillon"}</span>
      <div class="tt"><b>${esc(dLong(e.date))}</b><span>${e.formats.map(f => esc(f.id === "quiz" ? `Jeu : ${f.title || f.kind}` : (LBL[f.id] || f.id) + (f.images_total && f.images_done < f.images_total ? ` (${f.images_done}/${f.images_total})` : ""))).join(" · ") || "rien encore"}${e.newsletter ? " · textes newsletter ✓" : ""}</span></div></div>`).join("")}</div>`;
    $("#main").querySelectorAll("[data-dir]").forEach(r => { r.onclick = () => openItem(r.dataset.dir); r.onkeydown = e => { if (e.key === "Enter") openItem(r.dataset.dir); }; });
  } catch (e) {
    if (e.status === 401) return gate("Session expirée", "Reconnectez-vous dans l’appli, puis revenez ici.");
    $("#main").innerHTML = `<p class="note">${esc(e.message)}</p>`;
  } finally { $("#main").classList.remove("loading"); }
}
function caseView(c) {
  const t = [];
  if (c.kind === "explain") return `<div class="vcase"><div class="txt"><span class="tag">${esc(c.tag || "Pour mieux comprendre")}</span><b>${esc(c.title || "")}</b>${String(c.text || "").split("\n").map(x => `<p style="margin:0">${esc(x)}</p>`).join("")}${(c.steps || []).length ? `<ol>${c.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}${c.joke ? `<i>${esc(c.joke)}</i>` : ""}</div></div>`;
  if (c.kind === "photo") { const ph = c.photo || {}; return `<div class="vcase">${ph.src ? `<img src="${esc(ph.src)}" alt="" loading="lazy">` : `<div class="ph0">Photo ${esc(ph.status || "à récupérer")} : ${esc(ph.commons || "")}</div>`}<div class="txt"><span class="tag">${esc(c.tag || "En vrai")}</span><b>${esc(c.title || "")}</b><p style="margin:0">${esc(c.text || "")}</p><small>${esc([ph.credit, ph.license].filter(Boolean).join(" · "))}${ph.error ? " · " + esc(ph.error) : ""}</small></div></div>`; }
  const img = c.image || {};
  return `<div class="vcase">${img.src ? `<img src="${esc(img.src)}" alt="" loading="lazy">` : `<div class="ph0">${img.status === "failed" ? "Image en échec" : "Dessin en cours"}</div>`}<div class="txt">
    <span class="tag">${esc(`Case ${c.n || ""}${c.tag ? " · " + c.tag : ""}`)}</span>${c.caption ? `<p style="margin:0">${esc(c.caption)}</p>` : ""}${(c.bubbles || []).map(b => `<span class="bub ${b.side === "r" ? "r" : ""}">${esc(b.text)}</span>`).join("")}
    ${img.prompt ? `<details><summary>Prompt de l'image${img.redo ? " · à refaire" : ""}</summary>${esc(img.prompt)}</details>` : ""}</div></div>`;
}
function formatView(f) {
  if (f.id === "quiz") return `<h2>${esc(f.title || "Le jeu du jour")}</h2><p class="note">${esc(f.kind || "")}</p><ol class="qz">${(f.questions || []).map(q => `<li><b>${esc(q.q || q.prompt || q.type || "")}</b>${(q.choices || []).length ? `<ul>${q.choices.map((ch, i) => `<li class="${i === q.answer ? "ok" : ""}">${esc(ch)}</li>`).join("")}</ul>` : ""}${(q.items || []).length ? `<ul>${q.items.map(it => `<li>${esc(it.text || it.name || it.word || JSON.stringify(it))}</li>`).join("")}</ul>` : ""}${q.explain ? `<p class="note">${esc(q.explain)}</p>` : ""}</li>`).join("")}</ol>`;
  return `<p class="note">${esc(LBL[f.id] || f.label || f.id)}${f.theme ? " · " + esc(f.theme) : ""} · ${f.minutes || "?"} min</p><h2>${esc(f.title || "")}</h2><p>${esc(f.tagline || "")}</p>
    ${f.teaser ? `<p class="note"><b>Accroche newsletter :</b> ${esc(f.teaser)}</p>` : ""}
    ${(f.cast || []).length ? `<div class="cast">${f.cast.map(c => `<figure>${c.src ? `<img src="${esc(c.src)}" alt="">` : `<div class="ph0" style="width:96px;height:96px;border-radius:12px"></div>`}<figcaption>${esc(c.id)}</figcaption></figure>`).join("")}</div>` : ""}
    ${f.cover?.src ? `<div class="vcase"><img src="${esc(f.cover.src)}" alt=""><div class="txt"><span class="tag">Couverture</span></div></div>` : ""}
    ${(f.cases || []).map(caseView).join("")}
    ${f.final ? `<div class="vcase"><div class="txt"><span class="tag">Pour briller en société</span><b>${esc(f.final.text || "")}</b><small>${esc(f.final.source || "")}</small></div></div>` : ""}
    ${f.story ? `<div class="vcase"><div class="txt"><span class="tag">L'histoire complète</span>${String(f.story).split("\n").map(x => `<p style="margin:0">${esc(x)}</p>`).join("")}</div></div>` : ""}
    ${(f.sources || []).length ? `<p class="note">Sources : ${f.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join(" · ")}</p>` : ""}`;
}
async function openItem(dir) {
  const v = $("#viewer"); v.classList.add("on"); $("#vbody").innerHTML = `<p class="note">Chargement…</p>`;
  try {
    const d = await api(`/admin/item?dir=${encodeURIComponent(dir)}`);
    const nl = d.newsletter ? `<div class="vcase"><div class="txt"><span class="tag">Textes de la newsletter</span><b>${esc(d.newsletter.subject || "")}</b><p style="margin:0">${esc(d.newsletter.intro || "")}</p><small>${esc(d.newsletter.game || "")} · ${esc(d.newsletter.ps || "")}</small></div></div>` : "";
    $("#vbody").innerHTML = (d.date ? `<p class="note">Édition du ${esc(dLong(d.date))} · ${esc(d.status || "")}</p>${nl}` : `<p class="note">${esc(dir)}${d.blocked ? " · bloquée" : ""}</p>`)
      + (d.formats || []).map(formatView).join(`<hr style="border:0;border-top:2px dashed var(--line);margin:22px 0">`);
  } catch (e) { $("#vbody").innerHTML = `<p class="note">${esc(e.message)}</p>`; }
}
/* ---------- BD publiées : par date, lecture, masquer / remettre ---------- */
async function loadPublished() {
  $("#main").classList.add("loading");
  try {
    const d = await api("/admin/published");
    const n = d.editions.reduce((t, e) => t + e.formats.filter(f => f.hidden).length, 0);
    $("#main").innerHTML = `<h2>Les BD publiées</h2><p class="note">Masquer une BD la retire aussitôt de l'appli et de la prochaine newsletter${d.instant ? ", et du site public dans la minute" : " ; le site public (pages référencées) suit à la prochaine publication, dans l'heure"}. Rien n'est supprimé : « Remettre » la fait revenir.${n ? ` <b>${n} BD masquée(s).</b>` : ""}</p>
    ${d.editions.map(e => card(dLong(e.date) + (e.demo ? " · démo" : ""), "", e.formats.map(f => `<div class="prow ${f.hidden ? "off" : ""}">
        <span class="pill ${f.hidden ? "ko" : "ok"}">${f.hidden ? "Masquée" : "En ligne"}</span>
        <div class="tt"><b>${esc(f.title || (f.missing ? "(plus dans l'index publié)" : ""))}</b><span>${esc(LBL[f.id] || f.id)}${f.theme ? " · " + esc(f.theme) : ""} · ${nf(f.readers)} lecteur(s)${f.id !== "quiz" && f.readers ? ` · ${pct(f.done, f.readers)} au bout` : ""}</span></div>
        <button class="btn ghost" data-view="${e.date}">Voir</button>
        ${f.url && !f.hidden ? `<a class="btn ghost" href="${esc(f.url)}" target="_blank" rel="noopener">Page</a>` : ""}
        <button class="btn ${f.hidden ? "" : "ghost"}" data-hide="${e.date}|${f.id}" data-on="${f.hidden ? 0 : 1}">${f.hidden ? "Remettre" : "Masquer"}</button></div>`).join("") || `<p class="note">Aucune BD.</p>`)).join("")}`;
    $("#main").querySelectorAll("[data-view]").forEach(b => b.onclick = () => openItem(`editions/${b.dataset.view}`));
    $("#main").querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {
      const [ed, fid] = b.dataset.hide.split("|"), on = b.dataset.on === "1";
      if (on && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmer le masquage"; return; }
      b.disabled = true;
      try { const r = await api("/admin/hide", { body: { ed, fid, hidden: on } }); toast(on ? "BD masquée" + (r.rebuilt ? " ; le site se met à jour" : "") : "BD remise en ligne"); loadPublished(); }
      catch (er) { toast(er.message); b.disabled = false; }
    });
  } catch (e) {
    if (e.status === 401) return gate("Session expirée", "Reconnectez-vous dans l’appli, puis revenez ici.");
    $("#main").innerHTML = `<p class="note">${esc(e.message)}</p>`;
  } finally { $("#main").classList.remove("loading"); }
}
function route() {
  const v = location.hash.slice(1);
  $("#views").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  $("#range").hidden = !!v; $("#ttl").textContent = v === "bd" ? "BD à venir" : v === "pub" ? "BD publiées" : "Tableau de bord";
  v === "bd" ? loadQueue() : v === "pub" ? loadPublished() : load();
}
$("#views").querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.v; });
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#viewer").classList.remove("on"); });
$("#range").querySelectorAll("button").forEach(b => b.onclick = () => { DAYS = +b.dataset.d; $("#range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); load(); });
$("#refresh").onclick = route;
if (!/^https?:\/\//.test(API)) gate("API pas encore branchée", "L’adresse de l’API n’est pas encore réglée (<code>api_url</code> dans <code>pipeline/site.json</code>). Elle s’ajoute toute seule au premier déploiement de l’API.");
else if (!ACC?.session) gate("Connectez-vous d’abord", "Ouvrez l’appli, Profil › Créer mon compte, avec votre adresse d’administrateur. Puis revenez ici.");
else route();
</script>
